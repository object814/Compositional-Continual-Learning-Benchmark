# Conda environment for all baselines (MuJoCo-Warp version):
#   PYTHONNOUSERSITE=1 conda env create -f environment.yml
#   conda activate cclb-mujoco-warp
# To put it in a chosen directory, use `-p <dir>/cclb-mujoco-warp` in both commands.
name: cclb-mujoco-warp
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - -r requirements.txt
variables:
  # All baselines render MuJoCo offscreen with OSMesa (system libOSMesa).
  MUJOCO_GL: osmesa
  PYOPENGL_PLATFORM: osmesa
  # Ignore packages in ~/.local so only this environment's versions are used.
  PYTHONNOUSERSITE: "1"
