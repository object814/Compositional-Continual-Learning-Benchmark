# Conda environment for all baselines, created inside the repository (.conda/env)
# with the download caches there too, so nothing is written to the home directory:
#   CONDA_PKGS_DIRS=$PWD/.conda/pkgs PIP_CACHE_DIR=$PWD/.cache/pip PYTHONNOUSERSITE=1 \
#       conda env create -p ./.conda/env -f environment.yml
#   conda activate ./.conda/env
name: cclb-warp
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - -r requirements.txt
variables:
  # All baselines render MuJoCo offscreen with OSMesa (system libOSMesa).
  MUJOCO_GL: osmesa
  PYOPENGL_PLATFORM: osmesa
  # Ignore packages in ~/.local so only this environment's versions are used.
  PYTHONNOUSERSITE: "1"
