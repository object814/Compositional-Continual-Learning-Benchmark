  eval_every: 20000
  log_every: 20000
  dataset_size: 4e5
  action_repeat: 1
  batch_size: 64
  envs: 4
  parallel: True
  train_ratio: 512
  precision: 16
  video_pred_log: true
  size: [128, 128]
  dyn_deter: 48
  dyn_hidden: 48
  dyn_stoch: 16
  dyn_discrete: 16
  units: 64
  encoder:
    {mlp_keys: '.*', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 16, kernel_size: 4, minres: 4, mlp_layers: 1, mlp_units: 64, symlog_inputs: True}
  decoder:
    {mlp_keys: '.*', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 16, kernel_size: 4, minres: 4, mlp_layers: 1, mlp_units: 64, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
